        <main class = "small">

            <p>
            <a href="mailto:Htmlaboutandhelp.com">

            <section id="contact-us">
                <h2>
                    Send Us a Message
                </h2>
                <p id="formButtonHolder">
                    To fill out a message form, click <button id = "formButton" onclick="showForm()">here</button>
                </p>
            
                <form id="contact-form" action="#" method="get">
                
                    <fieldset>
                        <legend>
                            Have something you want to say?
                        </legend>
                    
                        <fieldset>
                        
                            <legend>
                                Your input
                            </legend>
                            <label>
                                Whats on your mind?
                            </label>
                            <br>
                            <label for="why1">
                                Question:
                            </label>
                            <input type ="radio" id="why1" name="why" value="Question">
                            <br>
                            <label for="why2">
                                Suggestion:
                            </label>
                            <input type ="radio" id="why2" name="why" value="Suggestion">
                            <br>
                            <label for="why3">
                                Other:
                            </label>
                            <input type ="radio" id="why3" name="why" value="Other">

                            <br>
                            <br>
                        
                            <label for="message">
                                Your thought
                            </label> 
                            <br>           
                            <input type="text" id="message" name="message" placeholder="right in here">
                        
                            <br>
                            <br>
                        
                            <!-- Keep these three ids: name, email, message (message is in 2d). Lesson 09 uses them. --> 
                        </fieldset>
                    
                        <br>
                    
                        <fieldset>
                            <legend>
                                About you
                            </legend>

                            <label for="name">
                                Name: *
                            </label>
                            <input type="text" id="name" name="name" placeholder="First and last name" required>

                            <br>
                        
                            <label for="email">
                                Email: *
                            </label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>

                            <br>
                        
                            <!-- Phone is optional, so no required -->
                            <label for="phone">
                                Phone:
                            </label>
                            <input type="tel" id="phone" name="phone" placeholder="330-555-0100">

                            <br>
                            <br>
                        
                        </fieldset>
                    
                        <br>
                    
                        <fieldset>
                            <legend>
                                Survey
                            </legend>
                            <br>
                            <label for="how">
                                How did you discover us
                            </label>
                            <select id="how" name="how">
                                <option value="discover 1">
                                    Family or Friend
                                </option>
                                <option value="discover 2">
                                    Online
                                </option>
                                <option value="discover 3">
                                    Other
                                </option>
                            </select>
                        
                            <br>
                            <br>
                        
                            <label class="choice">
                                <input type="checkbox" name="interests" value="drinks"> 
                                Drinks
                            </label>
                            <label class="choice">
                                <input type="checkbox" name="interests" value="pastries"> 
                                Pastries
                            </label>
                            <label class="choice">
                                <input type="checkbox" name="interests" value="events"> 
                                Events
                            </label>
                        </fieldset>
                    
                    <br>
                    
                    <div class="button-group">
                        <button type="submit">
                            Submit
                        </button>
                        <button type="reset" onclick="hideForm()">
                            Close and clear form
                        </button>
                    </div>
                
                    </fieldset>
                  <!-- Parts 2b - 2e go in here -->
                </form>
            </section>
        </main>
