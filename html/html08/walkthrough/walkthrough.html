<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Practice</title>
  <!-- Link the stylesheet you will write in step 12 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Club Sign-Up</h1>

  <!-- id: a name for this form (JavaScript will use it in Lesson 09)
       action: WHERE the answers are sent
       method: HOW the answers are sent (get or post) -->
  <form id="signup-form" action="#" method="get">
    <div>
    <label for = "fullName"> 
        Full name:
    </label>
    <input type= "text" id = "fullName" name = "fullName" placeholder = "Put yo name in" required>
    </div>

    <div>
    <label for="email">Email:</label>
    <input type = "email" id = "email" name = "email" placeholder = "email please!">
    </div>

    <br>

    <div>
        <label for="password">
            Password:
        </label>
        <input type = "password" id = "password" name="password" placeholder="Password, put it in">
    </div>

    <div>
        <label for="tel">
            Phone:
        </label>
        <input type="tel" id="tel" name="telephone number" placeholder="Give me yo number">
    </div>

    <br>
    
    <div>
        <label for="age">
            Age:
        </label>
        <input id="age" type="number" name="age" placeholder="How old" min="0" max="110">
    </div>

    <br>
    
    <div>
        <label for="date">
            Starting date:
        </label>
        <input id="date" type="date" name="date">
    </div>
    <div>
        <label for="url">
            Website:
        </label>
        <input type="url" id="url" name="url" placeholder="put yo site here">
    </div>

    <br>
    
    <div>
        <label for="nick">
            Nickname:
        </label>
        <input type="text" id="nick" name="nickname" placeholder="What I call you?">
    </div>

    <div>
        <p>
            Meeting time:
        </p>

        <label>
          <input type="radio" name="meetingTime" value="time" required>
          Before school
        </label>
        <label>
          <input type="radio" name="meetingTime" value="time">
          Lunch
        </label>
        <label>
          <input type="radio" name="meetingTime" value="time">
          After school
        </label>
    </div>
    <div>
    <p>
        What do you want to learn? (Pick any)
    </p>

    <label>
          <input type="checkbox" name="interests" value="html">
          HTML and CSS
        </label>
        <label>
          <input type="checkbox" name="interests" value="javascript">
          JavaScript
        </label>
        <label>
          <input type="checkbox" name="interests" value="games">
          Game design
        </label>
    <label for="grade">
        Grade:
    </label>
    <select id="grade" name="grade" required>
      <option value="">
        -- Choose one --
      </option>
      <option value="11">
        Junior (11th)
      </option>
      <option value="12">
        Senior (12th)
      </option>
      <option value="other">
        Other
      </option>
    </select>
        <label for="message">
            Why do you want to join?
        </label>
        <textarea id="message" name="message" rows="5" cols="40"placeholder="Tell us a little about yourself">

        </textarea>
    </div>
    <div class="button-group"> 
    <input type="reset">
    <input type="submit">
    </div>
</form>
</body>
</html>
