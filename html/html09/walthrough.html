    <script>
      let firstName = "Ryan";
      let ageNumber = 16;
      let ageString = "16";
      let isStudent = true;
      let score = 10
      let student;
      let a = 5;
      console.log(firstName);
      // Your walkthrough JavaScript goes below this line
      console.log(ageNumber);
      console.log(ageString);
      console.log(isStudent);
      console.log(ageNumber + score);
      console.log(firstName + ageString);
      if(isStudent === true){
        student = "a student"
      }else{
        student = "not a student"
      }

      setInterval(function() { 
        draw();
      }, 16.66); //So it waits one millisecond untill calling the draw function 

      function draw() {
        if(a > 0){
          console.log("My name is " + firstName + " and my age is " + ageString + " and I am " + student);
          a -= 1;
          console.log(a);
        }
      }
